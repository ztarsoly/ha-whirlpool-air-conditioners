name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Run by the Release workflow before publishing
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # The Python version the current Home Assistant release uses
      - name: Get Home Assistant's Python version
        id: python
        run: |
          VERSION=$(curl -fsSL https://raw.githubusercontent.com/home-assistant/core/master/.python-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: "pip"
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pylint
        run: python -m pylint custom_components tests

      # Run the tests even if pylint failed, so both results are visible.
      - name: Run tests with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest
