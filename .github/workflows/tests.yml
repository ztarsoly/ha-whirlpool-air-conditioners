name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements_test.txt

      - name: Run pylint
        run: python -m pylint custom_components tests

      # Run the tests even if pylint failed, so both results are visible.
      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest
